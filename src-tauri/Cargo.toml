[package]
name = "abilauncher"
version = "0.3.3"
description = "AbiLauncher — лаунчер Minecraft Java Edition для авторских сборок"
authors = ["AbiBok89"]
license = "MIT"
edition = "2021"

[lib]
name = "abilauncher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "AbiLauncher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "process", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "gzip"] }
futures-util = "0.3"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate", "time"] }
flate2 = "1"
tar = "0.4"
regex = "1"
url = "2"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
unicode-normalization = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_NetworkManagement_Dns", "Win32_Foundation"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
